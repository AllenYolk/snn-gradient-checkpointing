seed_everything: 2024

trainer:
  deterministic: False
  max_epochs: 300
  precision: 32
  num_sanity_val_steps: 0
  default_root_dir: ./ # training logs will be saved at `./lightning_logs`

model:
  channels: 128
  neuron_type: SJLIF
  num_classes: 10
  compress_x: True
  level: 0
  decay_lambda: 0.5
  learning_rate: 0.1
  momentum: 0.9
  lomo: False


data:
  data_dir: /export/home/data_allenyolk/CIFAR-10
  batch_size: 128
  num_workers: 4
  num_classes: 10
